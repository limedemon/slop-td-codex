<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="description" content="Slop TD player handbook: units, upgrades, crate odds and match rewards.">
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 64 64'%3E%3Ctext y='52' font-size='52'%3E%F0%9F%97%BF%3C/text%3E%3C/svg%3E">
<style>html{color-scheme:light dark}body{margin:0}img{max-width:100%}[hidden]{display:none!important}</style>
<title>Слоп ТД</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Chakra+Petch:wght@600;700&family=IBM+Plex+Mono:wght@400;600&family=IBM+Plex+Sans:wght@400;500;600&display=swap">
<style>
:root{
  --ground:#F1EFF6; --surface:#FFFFFF; --surface-2:#F7F5FB; --line:#DCD7E6;
  --ink:#191423; --ink-2:#4A4358; --muted:#756E85; --accent:#5B34D6; --accent-soft:#EDE7FD;
  --off:#8A8296;
  --r-Common:#7E7889; --r-Uncommon:#2F8F4E; --r-Rare:#2563EB; --r-Legendary:#B47908;
  --r-Mythical:#A32FB8; --r-Godly:#D2541C; --r-Secret:#C7223A; --r-Celestial:#0E8FA3;
  --r-Exclusive:#D12E82; --r-Hero:#0E8C80; --r-none:#756E85;
  --t-start:#2F8F4E; --t-mid:#B47908; --t-end:#C7223A;
  --money:#49BE78; --money-2:#2F8E58; --money-3:#1C6540; --money-dot:#EAFBF0;
  --shadow:0 1px 2px rgba(25,20,35,.06), 0 8px 24px -16px rgba(25,20,35,.22);
  --lift:0 2px 6px rgba(25,20,35,.08), 0 18px 40px -24px rgba(25,20,35,.4);
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    --ground:#120F19; --surface:#1A1624; --surface-2:#211C2D; --line:#2F2840;
    --ink:#EEEAF6; --ink-2:#C3BCD3; --muted:#958CA8; --accent:#B196FF; --accent-soft:#2A2140;
    --off:#7B7390;
    --r-Common:#9A94A8; --r-Uncommon:#54C97C; --r-Rare:#6CA0FF; --r-Legendary:#EAB040;
    --r-Mythical:#D473E6; --r-Godly:#FF8B4F; --r-Secret:#FF6076; --r-Celestial:#3DD2E6;
    --r-Exclusive:#FF6FB4; --r-Hero:#2FD3C2; --r-none:#958CA8;
    --t-start:#54C97C; --t-mid:#EAB040; --t-end:#FF6076;
    --money:#5AD489; --money-2:#37A465; --money-3:#207547; --money-dot:#F0FFF6;
    --shadow:0 1px 2px rgba(0,0,0,.4), 0 10px 28px -18px rgba(0,0,0,.8);
    --lift:0 2px 8px rgba(0,0,0,.5), 0 22px 44px -26px rgba(0,0,0,1);
  }
}
:root[data-theme="dark"]{
  --ground:#120F19; --surface:#1A1624; --surface-2:#211C2D; --line:#2F2840;
  --ink:#EEEAF6; --ink-2:#C3BCD3; --muted:#958CA8; --accent:#B196FF; --accent-soft:#2A2140;
  --off:#7B7390;
  --r-Common:#9A94A8; --r-Uncommon:#54C97C; --r-Rare:#6CA0FF; --r-Legendary:#EAB040;
  --r-Mythical:#D473E6; --r-Godly:#FF8B4F; --r-Secret:#FF6076; --r-Celestial:#3DD2E6;
  --r-Exclusive:#FF6FB4; --r-Hero:#2FD3C2; --r-none:#958CA8;
  --t-start:#54C97C; --t-mid:#EAB040; --t-end:#FF6076;
  --money:#5AD489; --money-2:#37A465; --money-3:#207547; --money-dot:#F0FFF6;
  --shadow:0 1px 2px rgba(0,0,0,.4), 0 10px 28px -18px rgba(0,0,0,.8);
  --lift:0 2px 8px rgba(0,0,0,.5), 0 22px 44px -26px rgba(0,0,0,1);
}
*{box-sizing:border-box}
body{margin:0; background:var(--ground); color:var(--ink);
  font-family:"IBM Plex Sans","Segoe UI",system-ui,sans-serif; font-size:15px; line-height:1.55;
  -webkit-font-smoothing:antialiased}
h1,h2,h3{font-family:"Chakra Petch","Segoe UI",system-ui,sans-serif; font-weight:700;
  text-wrap:balance; margin:0}
.wrap{max-width:1200px; margin:0 auto; padding-inline:20px; padding-block:0 72px}

header.top{padding-block:34px 18px}
.brand{display:flex; align-items:baseline; gap:12px; flex-wrap:wrap}
.brand h1{font-size:clamp(26px,4.4vw,38px); letter-spacing:-.01em; line-height:1.05}
.brand .tagline{font-family:"IBM Plex Mono",ui-monospace,monospace; font-size:12px;
  letter-spacing:.14em; text-transform:uppercase; color:var(--accent)}
.brand p{margin:0; color:var(--ink-2); flex-basis:100%; max-width:66ch}

nav.tabs{position:sticky; top:0; z-index:30; background:var(--ground);
  border-bottom:1px solid var(--line); display:flex; gap:4px; flex-wrap:wrap; align-items:center;
  padding-block:10px; margin-top:14px}
nav.tabs a{font-family:"Chakra Petch",sans-serif; font-weight:700; font-size:15px;
  text-decoration:none; color:var(--muted); padding:7px 14px; border-radius:8px;
  transition:background .18s ease, color .18s ease}
nav.tabs a:hover{color:var(--ink); background:var(--surface-2)}
nav.tabs a.on{color:var(--accent); background:var(--accent-soft)}
nav.tabs a .n{font-family:"IBM Plex Mono",monospace; font-size:11px; font-weight:400;
  color:var(--muted); margin-left:6px}
.updated{margin-left:auto; display:flex; align-items:center; gap:7px; padding:5px 11px;
  border-radius:999px; border:1px solid var(--line); background:var(--surface);
  font-family:"IBM Plex Mono",ui-monospace,monospace; font-size:11.5px; color:var(--muted);
  white-space:nowrap}
.updated .dot{width:7px; height:7px; border-radius:50%; background:var(--t-start); flex:none;
  box-shadow:0 0 0 0 var(--t-start); animation:pulse 2.6s ease-out infinite}
@keyframes pulse{0%{box-shadow:0 0 0 0 rgba(47,143,78,.5)} 70%{box-shadow:0 0 0 7px rgba(47,143,78,0)}
  100%{box-shadow:0 0 0 0 rgba(47,143,78,0)}}
.updated b{color:var(--ink-2); font-weight:600}
.langswitch{margin-left:10px; display:flex; gap:2px; padding:2px; border-radius:999px;
  border:1px solid var(--line); background:var(--surface)}
.langswitch button{font-family:"IBM Plex Mono",ui-monospace,monospace; font-size:11.5px;
  font-weight:600; letter-spacing:.08em; padding:5px 11px; border:0; border-radius:999px;
  background:transparent; color:var(--muted); cursor:pointer;
  transition:background .18s ease, color .18s ease}
.langswitch button:hover{color:var(--ink)}
.langswitch button[aria-pressed="true"]{background:var(--accent-soft); color:var(--accent)}
nav.tabs a:focus-visible, .card:focus-visible, .chip:focus-visible, input:focus-visible,
select:focus-visible, .back:focus-visible, .langswitch button:focus-visible{
  outline:2px solid var(--accent); outline-offset:2px}

.controls{display:flex; flex-wrap:wrap; gap:10px; align-items:center; margin:20px 0 6px}
.controls input[type="search"], .controls select{padding:9px 12px; border-radius:8px;
  border:1px solid var(--line); background:var(--surface); color:var(--ink); font:inherit}
.controls input[type="search"]{flex:1 1 240px; min-width:0}
.chips{display:flex; flex-wrap:wrap; gap:6px}
.chip{font-family:"IBM Plex Mono",ui-monospace,monospace; font-size:11.5px; letter-spacing:.06em;
  text-transform:uppercase; padding:5px 9px; border-radius:999px; cursor:pointer;
  border:1px solid var(--line); background:var(--surface); color:var(--muted);
  transition:background .16s ease, color .16s ease, border-color .16s ease}
.chip:hover{color:var(--ink)}
.chip[aria-pressed="true"]{background:var(--accent-soft); border-color:var(--accent); color:var(--accent)}
.resultline{font-family:"IBM Plex Mono",ui-monospace,monospace; font-size:12px;
  color:var(--muted); margin:0 0 16px}

.grid{display:grid; gap:14px; grid-template-columns:repeat(auto-fill,minmax(250px,1fr))}
.grid.boxes{grid-template-columns:repeat(auto-fill,minmax(310px,1fr))}
.grid.modes{grid-template-columns:repeat(auto-fill,minmax(280px,1fr))}

.card{position:relative; display:block; width:100%; text-align:left; cursor:pointer;
  background:var(--surface); border:1px solid var(--line); border-radius:12px;
  padding:14px 15px 13px 18px; box-shadow:var(--shadow); color:inherit; font:inherit;
  overflow:hidden; transition:transform .18s cubic-bezier(.2,.7,.3,1), box-shadow .18s ease,
  border-color .18s ease; animation:pop .32s cubic-bezier(.2,.7,.3,1) both}
.card::before{content:""; position:absolute; inset:0 auto 0 0; width:4px; background:var(--c,var(--line))}
.card:hover{transform:translateY(-3px); box-shadow:var(--lift); border-color:var(--c,var(--accent))}
@keyframes pop{from{opacity:0; transform:translateY(10px)} to{opacity:1; transform:none}}
.card h3{font-size:16px; line-height:1.2; overflow-wrap:anywhere}
.card .meta{display:flex; flex-wrap:wrap; gap:5px; margin-top:7px}
.card .foot{display:flex; justify-content:space-between; align-items:baseline; gap:10px; margin-top:11px}
.card .price{font-family:"IBM Plex Mono",monospace; font-weight:600; font-size:15px;
  display:inline-flex; align-items:center; gap:6px}
.cash{width:26px; height:19.5px; flex:none; display:inline-block; vertical-align:-4px;
  transition:transform .2s cubic-bezier(.2,.7,.3,1)}
.card:hover .cash{transform:translateY(-2px) rotate(-6deg) scale(1.06)}
.stat .v .cash{width:32px; height:24px; vertical-align:-5px; margin-right:6px}
.card .dps{font-family:"IBM Plex Mono",monospace; font-size:11.5px; color:var(--muted)}

.tag{font-family:"IBM Plex Mono",ui-monospace,monospace; font-size:10.5px; letter-spacing:.07em;
  text-transform:uppercase; padding:2px 7px; border-radius:4px; white-space:nowrap;
  border:1px solid var(--line); color:var(--ink-2); background:var(--surface-2)}
.tag.rar{color:#FFFFFF; border-color:transparent}
.tag.tier-start{color:var(--t-start); border-color:currentColor; background:transparent}
.tag.tier-mid{color:var(--t-mid); border-color:currentColor; background:transparent}
.tag.tier-end{color:var(--t-end); border-color:currentColor; background:transparent}

.view{animation:slidein .3s cubic-bezier(.2,.7,.3,1) both}
@keyframes slidein{from{opacity:0; transform:translateY(14px)} to{opacity:1; transform:none}}
.back{display:inline-flex; align-items:center; gap:7px; font-family:"IBM Plex Mono",monospace;
  font-size:12.5px; color:var(--muted); text-decoration:none; margin:18px 0 14px;
  transition:color .16s ease}
.back:hover{color:var(--accent)}

.detail-head{display:flex; flex-wrap:wrap; gap:10px 18px; align-items:baseline;
  padding-bottom:16px; border-bottom:1px solid var(--line)}
.detail-head h2{font-size:clamp(23px,4vw,33px); line-height:1.05}
.detail-head .tags{display:flex; flex-wrap:wrap; gap:6px}
.panel{background:var(--surface); border:1px solid var(--line); border-radius:12px;
  box-shadow:var(--shadow); overflow:hidden; margin-top:18px}
.panel > h3{padding:13px 16px 11px; border-bottom:1px solid var(--line);
  background:var(--surface-2); font-size:15px}
.stats{display:grid; grid-template-columns:repeat(auto-fit,minmax(150px,1fr)); gap:1px;
  background:var(--line)}
.stat{background:var(--surface); padding:13px 16px}
.stat .k{font-family:"IBM Plex Mono",ui-monospace,monospace; font-size:10.5px;
  letter-spacing:.08em; text-transform:uppercase; color:var(--muted)}
.stat .v{font-family:"IBM Plex Mono",ui-monospace,monospace; font-size:19px; font-weight:600;
  font-variant-numeric:tabular-nums; margin-top:3px}
.stat .d{font-family:"IBM Plex Mono",ui-monospace,monospace; font-size:11.5px; color:var(--muted)}

table{width:100%; border-collapse:collapse; font-size:13.5px}
table th, table td{text-align:left; padding:8px 16px; border-top:1px solid var(--line)}
table th{font-family:"IBM Plex Mono",ui-monospace,monospace; font-size:10.5px;
  letter-spacing:.07em; text-transform:uppercase; color:var(--muted); font-weight:400}
table thead th{border-top:0}
table td.num, table th.num{text-align:right; font-family:"IBM Plex Mono",ui-monospace,monospace;
  font-variant-numeric:tabular-nums}
table tbody tr{transition:background .14s ease}
table tbody tr:hover{background:var(--surface-2)}
tfoot td{font-weight:600; background:var(--surface-2)}
.tablewrap{overflow-x:auto}

.kvlist{display:grid; grid-template-columns:repeat(auto-fit,minmax(210px,1fr)); gap:1px;
  background:var(--line)}
.kv{background:var(--surface); padding:11px 16px; display:flex; justify-content:space-between;
  gap:12px; font-size:13.5px}
.kv span:first-child{color:var(--muted)}
.kv span:last-child{font-family:"IBM Plex Mono",ui-monospace,monospace; text-align:right}

.drops{list-style:none; margin:0; padding:0}
.drop{display:grid; grid-template-columns:3px 1fr auto; gap:0 12px; align-items:center;
  padding:8px 16px 8px 0; border-top:1px solid var(--line)}
.stripe{width:3px; align-self:stretch; border-radius:0 2px 2px 0}
.dname .n{display:block; overflow-wrap:anywhere}
.dname .r{font-family:"IBM Plex Mono",ui-monospace,monospace; font-size:10.5px;
  letter-spacing:.07em; text-transform:uppercase}
.dnum{text-align:right; white-space:nowrap}
.pct{display:block; font-family:"IBM Plex Mono",monospace; font-weight:600; font-size:14px;
  font-variant-numeric:tabular-nums}
.odds{display:block; font-family:"IBM Plex Mono",monospace; font-size:11px; color:var(--muted);
  font-variant-numeric:tabular-nums}
.pool{padding:8px 16px 12px; display:flex; flex-wrap:wrap; gap:5px}
.unitchip{font-size:12px; padding:2px 8px; border-radius:5px; background:var(--surface-2);
  border:1px solid var(--line); color:var(--ink-2)}
.unitchip.boost{border-color:var(--accent); color:var(--accent); font-weight:600}
.note{padding:10px 16px; border-top:1px solid var(--line); background:var(--surface-2);
  font-family:"IBM Plex Mono",ui-monospace,monospace; font-size:11.5px; color:var(--muted)}
.note.warn{color:var(--t-end)}

.empty{padding:34px 0; color:var(--muted); font-family:"IBM Plex Mono",monospace; font-size:13px}
.secnote{margin:0 0 18px; color:var(--muted); font-size:13.5px; max-width:72ch}
h2.sec{font-size:21px; margin:34px 0 4px}
footer{margin-top:56px; padding-top:20px; border-top:1px solid var(--line);
  color:var(--muted); font-size:13px; max-width:76ch}
@media (max-width:520px){
  .drop{grid-template-columns:3px 1fr; row-gap:2px}
  .dnum{grid-column:2; text-align:left; display:flex; gap:10px; align-items:baseline}
  .langswitch, .updated{margin-left:0}
}
@media (prefers-reduced-motion:reduce){*{animation:none !important; transition:none !important}}
</style>
</head>
<body>

</header>

<main id="app"></main>

</div>

let LANG = "ru";
try { const s = localStorage.getItem("slopcodex-lang"); if(s === "ru" || s === "en") LANG = s; } catch(e){}
let T = I18N[LANG];

const esc = s => String(s).replace(/[&<>"]/g, c => ({"&":"&amp;","<":"&lt;",">":"&gt;","\"":"&quot;"}[c]));
const rc = r => "var(--r-" + (String(r || "none").replace(/[^A-Za-z]/g, "") || "none") + ")";
const fmt = n => (n == null ? T.dash : Number(n).toLocaleString(T.locale));
const fmt2 = n => (n == null ? T.dash : (Math.round(n * 100) / 100).toLocaleString(T.locale));
const cur = k => (T.cur[k] || k);

function pct(v){
  if(v >= 10) return (v % 1 ? v.toFixed(1) : v.toFixed(0)) + "%";
  if(v >= 1) return (+v.toFixed(2)) + "%";
  return (+v.toFixed(6)) + "%";
}
function odds(v){
  if(!v) return "";
  const n = 100 / v;
  if(n < 2) return "";
  let r;
  if(n < 100) r = Math.round(n);
  else if(n < 10000) r = Math.round(n / 10) * 10;
  else r = Math.round(n / 100) * 100;
  return T.oneIn(r.toLocaleString(T.locale));
}

const uState = { q: "", rar: new Set(), tier: new Set(), type: "", sort: "price" };

function unitCard(u, i){
  return '<button class="card" style="--c:' + rc(u.rarity) + ";animation-delay:" + Math.min(i, 24) * 18
    + 'ms" data-unit="' + esc(u.name) + '"><h3>' + esc(u.name) + "</h3>"
    + '<div class="meta"><span class="tag rar" style="background:' + rc(u.rarity) + '">' + esc(u.rarity) + "</span>"
    + '<span class="tag tier-' + u.tier + '">' + T.tiers[u.tier] + "</span>"
    + '<span class="tag">' + esc(u.type) + "</span></div>"
    + '<div class="foot"><span class="price">' + CASH + "<span>" + fmt(u.price) + "</span></span>"
    + '<span class="dps">' + (u.maxDps ? T.maxDpsShort + fmt2(u.maxDps)
        : (u.customText ? esc(u.customText) + " ×" + u.customMax : T.dash)) + "</span></div></button>";
}

function unitsView(){
  const types = Array.from(new Set(U.map(u => u.type))).sort();

    + '<option value="total">' + T.sortTotal + '</option><option value="name">' + T.sortName + "</option>"
    + "</select></div>"

    + DATA.tierOrder.map(t => '<button class="chip" data-t="' + t + '" aria-pressed="' + uState.tier.has(t) + '">' + T.tiers[t] + "</button>").join("")
    + '</div><div class="chips" id="urar">'
    + DATA.rarityOrder.map(r => '<button class="chip" data-r="' + r + '" aria-pressed="' + uState.rar.has(r) + '">' + r + "</button>").join("")
    + '</div></div><p class="resultline" id="ures"></p><div class="grid" id="ugrid"></div>'
    + '<p class="empty" id="uempty" hidden>' + T.nothing + "</p></div>";

function renderUnits(){
  const q = uState.q.trim().toLowerCase();
  let list = U.filter(u => {
    if(uState.rar.size && !uState.rar.has(u.rarity)) return false;
    if(uState.tier.size && !uState.tier.has(u.tier)) return false;
    if(uState.type && u.type !== uState.type) return false;
    if(q && (u.name + " " + u.type).toLowerCase().indexOf(q) === -1) return false;
    return true;
  });
  const s = uState.sort;
  list = list.slice().sort((a, b) =>
    s === "name" ? a.name.localeCompare(b.name, "en")
    : s === "dps" ? (b.maxDps || 0) - (a.maxDps || 0)
    : s === "total" ? a.totalCost - b.totalCost
    : a.price - b.price);
  document.getElementById("ugrid").innerHTML = list.map(unitCard).join("");
  document.getElementById("uempty").hidden = list.length > 0;
  document.getElementById("ures").textContent = T.shown(list.length, U.length);
}

function upgradeTable(u){
  if(!u.upgrades.length) return '<div class="note">' + T.noUpgrades + "</div>";
  let prevD = u.dmg, prevR = u.range, run = 0;
  const rows = u.upgrades.map((up, i) => {
    run += up.price;
    const dps = (up.dmg && up.cd) ? up.dmg / up.cd : null;
    const d = (a, b) => (a != null && b != null && a !== b)
      ? ' <b style="color:var(--t-start)">+' + fmt2(a - b) + "</b>" : "";
    const r = "<tr><td>" + (i + 1) + '</td><td class="num">' + fmt(up.price) + "</td>"
      + '<td class="num">' + fmt(up.dmg) + d(up.dmg, prevD) + "</td>"
      + '<td class="num">' + fmt2(up.cd) + "</td>"
      + '<td class="num">' + fmt2(up.range) + d(up.range, prevR) + "</td>"
      + '<td class="num">' + fmt2(dps) + "</td>"
      + '<td class="num">' + fmt(run) + "</td></tr>";
    prevD = up.dmg; prevR = up.range;
    return r;
  }).join("");
  return '<div class="tablewrap"><table><thead><tr><th>' + T.thLvl + '</th><th class="num">' + T.thPrice
    + '</th><th class="num">' + T.thDmg + '</th><th class="num">' + T.thCd + '</th><th class="num">'
    + T.thRange + '</th><th class="num">' + T.thDps + '</th><th class="num">' + T.thSpent + "</th></tr></thead>"
    + "<tbody>" + rows + "</tbody>"
    + "<tfoot><tr><td>" + T.thTotal + '</td><td class="num">' + fmt(u.upCost) + '</td><td colspan="4"></td>'
    + '<td class="num">' + fmt(u.totalCost) + "</td></tr></tfoot></table></div>";
}

function statTile(k, v, base){
  return '<div class="stat"><div class="k">' + k + '</div><div class="v">' + v + "</div>"
    + (base ? '<div class="d">' + base + "</div>" : "") + "</div>";
}

function unitView(name){
  const u = byName[name];
  if(!u) return '<div class="view"><p class="empty">' + T.nothing + "</p></div>";
  const boost = u.customText && u.customValue != null;
  const inBoxes = BOXES.filter(b => b.drops.some(d => d.name === u.name)).map(b => b.name);
  const inSummon = [];
  DATA.summons.forEach(s => {
    s.chances.forEach(r => { if(r.units.indexOf(u.name) !== -1) inSummon.push(s.name + " · " + r.rarity); });
    Object.keys(s.extraPools).forEach(r => { if(s.extraPools[r].indexOf(u.name) !== -1) inSummon.push(s.name + " · " + r); });
  });

  let tiles = "";
  if(u.dmgShown && u.dmg != null) tiles += statTile(T.sDamage, fmt(u.maxDmg != null ? u.maxDmg : u.dmg), u.dmg !== u.maxDmg ? T.base + fmt(u.dmg) : "");
  if(u.cdShown && u.cd != null) tiles += statTile(T.sCooldown, fmt2(u.maxCd != null ? u.maxCd : u.cd) + T.sec, u.cd !== u.maxCd ? T.base + fmt2(u.cd) + T.sec : "");
  if(u.range != null) tiles += statTile(T.sRange, fmt2(u.maxRange != null ? u.maxRange : u.range), u.range !== u.maxRange ? T.base + fmt2(u.range) : "");
  if(u.dpsShown && u.maxDps) tiles += statTile(T.sDps, fmt2(u.maxDps), u.dps !== u.maxDps ? T.base + fmt2(u.dps) : "");
  if(boost) tiles += statTile(esc(u.customText), "×" + u.customMax, T.base + "×" + u.customValue);
  tiles += statTile(T.sPlace, CASH + fmt(u.price), T.maxUpgraded + fmt(u.totalCost));

  return '<div class="view"><a class="back" href="#/units">' + T.backUnits + "</a>"
    + '<div class="detail-head"><h2>' + esc(u.name) + "</h2>"
    + '<div class="tags"><span class="tag rar" style="background:' + rc(u.rarity) + '">' + esc(u.rarity) + "</span>"
    + '<span class="tag tier-' + u.tier + '">' + T.tiers[u.tier] + "</span>"
    + '<span class="tag">' + esc(u.type) + "</span>"
    + (u.premium ? '<span class="tag">' + T.tagPremium + "</span>" : "")
    + (u.hidden ? '<span class="tag">' + T.tagHidden + "</span>" : "")
    + "</div></div>"
    + '<div class="panel"><h3>' + T.pStats + '</h3><div class="stats">' + tiles + "</div></div>"
    + '<div class="panel"><h3>' + T.pUpgrades + "</h3>" + upgradeTable(u) + "</div>"
    + '<div class="panel"><h3>' + T.pMisc + '</h3><div class="kvlist">'
    + '<div class="kv"><span>' + T.kLimit + "</span><span>" + (u.maxPlace != null ? u.maxPlace + T.pcs : T.vNoLimit) + "</span></div>"
    + '<div class="kv"><span>' + T.kFromSummon + "</span><span>"
      + (u.summonable === false ? T.vNo : (inSummon.length ? T.vYes : T.vUnknown)) + "</span></div>"
    + '<div class="kv"><span>' + T.kPools + "</span><span>" + (inSummon.length ? esc(inSummon.join(", ")) : T.dash) + "</span></div>"
    + '<div class="kv"><span>' + T.kBoxes + "</span><span>" + (inBoxes.length ? esc(inBoxes.join(", ")) : T.dash) + "</span></div>"
    + "</div></div></div>";
}

function renderCrates(){

function dropRow(d){
  const r = d.rarity || null;
  const label = r ? r : (d.type && d.type !== "Tower" ? T.currency : T.dash);
  const nm = (d.type && d.type !== "Tower") ? cur(d.name) + " ×" + d.amount : d.name;
  const clickable = byName[d.name] ? ' data-unit="' + esc(d.name) + '" style="cursor:pointer"' : "";
  return '<li class="drop"' + clickable + '><span class="stripe" style="background:' + rc(r) + '"></span>'
    + '<span class="dname"><span class="n">' + esc(nm) + "</span>"
    + '<span class="r" style="color:' + rc(r) + '">' + esc(label) + "</span></span>"
    + '<span class="dnum"><span class="pct" style="color:' + rc(r) + '">' + pct(d.chance) + "</span>"
    + '<span class="odds">' + odds(d.chance) + "</span></span></li>";
}

function boxView(name){
  const b = boxByName[name];
  if(!b) return '<div class="view"><p class="empty">' + T.nothing + "</p></div>";
  const src = [];
  if(b.price != null) src.push('<div class="kv"><span>' + T.thPrice + "</span><span>" + fmt(b.price) + " " + cur(b.currency) + "</span></div>");
  b.sources.forEach(s => src.push('<div class="kv"><span>' + (T.src[s.key] || s.key) + "</span><span>" + fmt(s.price) + " " + cur(s.cur) + "</span></div>"));
  src.push('<div class="kv"><span>' + T.kState + "</span><span>" + (b.enabled ? T.enabled : T.disabled) + "</span></div>");
  src.push('<div class="kv"><span>' + T.kInside + "</span><span>" + b.drops.length + "</span></div>");
  const warn = Math.abs(b.sum - 100) > 0.02;
  return '<div class="view"><a class="back" href="#/crates">' + T.backBoxes + "</a>"
    + '<div class="detail-head"><h2>' + esc(b.name) + "</h2>"
    + '<div class="tags"><span class="tag rar" style="background:' + rc(b.tier) + '">' + esc(b.tier || T.dash) + "</span></div></div>"
    + '<div class="panel"><h3>' + T.pGeneral + '</h3><div class="kvlist">' + src.join("") + "</div></div>"
    + '<div class="panel"><h3>' + T.pDrops + '</h3><ul class="drops">' + b.drops.map(dropRow).join("") + "</ul>"
    + '<div class="note' + (warn ? " warn" : "") + '">' + T.sumChances(+b.sum.toFixed(4)) + "</div></div></div>";
}

function bannerPanel(s){
  const rows = s.chances.map(r => poolRow(r.rarity, r.chance, r.units, r.boosted)).join("")
    + Object.keys(s.extraPools).map(r => poolRow(r, null, s.extraPools[r], null)).join("");
  const total = s.chances.reduce((a, b) => a + b.chance, 0);
  return '<div class="panel" style="margin-top:0"><h3>' + esc(s.name) + " Summon · ×1 " + s.prices.x1
    + " / ×10 " + s.prices.x10 + " / ×50 " + s.prices.x50 + " " + cur(s.currency) + "</h3>"
    + rows + '<div class="note' + (Math.abs(total - 100) > 0.02 ? " warn" : "") + '">'
    + T.sumByRarity(+total.toFixed(5)) + "</div></div>";
}

function poolRow(rarity, chance, units, boosted){
  const num = chance == null ? '<span class="odds">' + T.noChance + "</span>"
    : '<span class="pct" style="color:' + rc(rarity) + '">' + pct(chance) + '</span><span class="odds">' + odds(chance) + "</span>";
  return '<div class="drop"><span class="stripe" style="background:' + rc(rarity) + '"></span>'
    + '<span class="dname"><span class="n" style="font-weight:600;color:' + rc(rarity) + '">' + esc(rarity) + "</span></span>"
    + '<span class="dnum">' + num + "</span></div>"
    + '<div class="pool">' + units.map(u => '<span class="unitchip ' + (u === boosted ? "boost" : "")
        + '" data-unit="' + esc(u) + '" style="cursor:pointer">' + esc(u) + "</span>").join("") + "</div>";
}

function pityPanels(){
  const p = DATA.summons.map(s =>
    '<div class="panel" style="margin-top:0"><h3>' + T.pityOf + esc(s.name) + "</h3>"
    + '<div class="tablewrap"><table><thead><tr><th>' + T.thRarity + '</th><th class="num">' + T.thSummons
    + "</th></tr></thead><tbody>"
    + Object.keys(s.pity).map(r => '<tr><td style="color:' + rc(r) + '">' + esc(r) + '</td><td class="num">'
      + fmt(s.pity[r]) + "</td></tr>").join("") + "</tbody></table></div></div>").join("");
  return p + '<div class="panel" style="margin-top:0"><h3>' + T.pModifiers + "</h3>"
    + '<div class="tablewrap"><table><thead><tr><th>' + T.thModifier + '</th><th class="num">' + T.thChance
    + "</th><th>" + T.thEffect + "</th></tr></thead><tbody>"
    + DATA.modifiers.map(x => "<tr><td><b>" + esc(x.name) + '</b></td><td class="num">' + x.chance
      + "%</td><td>" + esc(T.mods[x.name] || "") + "</td></tr>").join("") + "</tbody></table></div></div>";
}

/* ========== КАТКИ ========== */
const CUR_ORDER = ["Cash", "Gems", "Stars", "Chi", "Sheckles", "Bones", "Cogs", "Suns"];
const mState = { cur: "", only: false };
const amountOf = (m, c) => { const x = m.currencies.find(y => y.raw === c); return x ? x.amount : 0; };

// Сводка по каждой награде: сколько режимов её дают и где её больше всего.
function farmRows(){
  return CUR_ORDER.map(c => {
    const src = MODES.filter(m => m.currencies.some(x => x.raw === c))
      .map(m => ({ name: m.name, amount: m.currencies.find(x => x.raw === c).amount }))
      .sort((a, b) => b.amount - a.amount);
    return src.length ? { raw: c, count: src.length, best: src[0] } : null;
  }).filter(Boolean);
}

function farmPanel(){
  return '<div class="panel" style="margin-top:0">'
    + '<div class="tablewrap"><table><thead><tr><th>' + T.thCurrency + '</th><th class="num">'
    + T.thSources + "</th><th>" + T.thBest + '</th><th class="num">' + T.thAmount
    + "</th></tr></thead><tbody>"
    + farmRows().map(r => "<tr><td><b>" + esc(cur(r.raw)) + '</b></td><td class="num">'
        + T.sourcesN(r.count) + "</td><td>" + esc(r.best.name) + '</td><td class="num">'
        + fmt(r.best.amount) + "</td></tr>").join("")
    + "</tbody></table></div></div>";
}

function modeCard(m, i, hi, best){
  const c = m.endless ? "var(--r-Celestial)" : "var(--r-Rare)";
  const rows = m.currencies.map(x => {
      const on = hi && x.raw === hi;
      return '<div class="kv"' + (on ? ' style="background:var(--accent-soft)"' : "") + "><span"
        + (on ? ' style="color:var(--accent)"' : "") + ">" + esc(cur(x.raw)) + "</span><span"
        + (on ? ' style="color:var(--accent);font-weight:600"' : "") + ">" + fmt(x.amount) + "</span></div>";
    }).join("")
    + m.chests.map(x => '<div class="kv"><span>' + esc(x.name) + "</span><span>" + esc(x.chance) + "</span></div>").join("");
  return '<div class="card" style="--c:' + c + ";animation-delay:" + Math.min(i, 24) * 18 + 'ms;cursor:default">'
    + "<h3>" + esc(m.name) + "</h3>"
    + '<div class="meta"><span class="tag">' + (m.endless ? T.tagEndless : T.tagNormal) + "</span>"
    + (best ? '<span class="tag tier-start">' + T.tagBest + "</span>" : "") + "</div>"
    + '<div class="kvlist" style="margin-top:11px;background:transparent;gap:0">' + rows + "</div></div>";
}

function modesView(){
  return '<div class="view"><p class="secnote">' + T.modesNote + "</p>"
    + '<h2 class="sec">' + T.secFarm + '</h2><p class="secnote">' + T.farmNote + "</p>"
    + farmPanel()
    + '<div class="controls"><div class="chips" id="curchips">'
    + '<button class="chip" data-c="" aria-pressed="' + (mState.cur === "") + '">' + T.allRewards + "</button>"
    + CUR_ORDER.map(c => '<button class="chip" data-c="' + c + '" aria-pressed="' + (mState.cur === c) + '">'
        + esc(cur(c)) + "</button>").join("")
    + '<button class="chip" id="curonly" aria-pressed="' + mState.only + '">' + T.onlyWith + "</button>"
    + '</div></div><div id="modesBody"></div></div>';
}

function renderModes(){
  const hi = mState.cur;
  let list = MODES.slice();
  if(hi){
    // Сортируем ВСЕ карты по выбранной награде; режимы без неё уходят в хвост,
    // а прячутся только если включён отдельный тумблер.
    if(mState.only) list = list.filter(m => amountOf(m, hi) > 0);
    list.sort((a, b) => (amountOf(b, hi) - amountOf(a, hi)) || a.name.localeCompare(b.name, "en"));
  }
  const normal = list.filter(m => !m.endless), endless = list.filter(m => m.endless);
  const bestName = (hi && list.length && amountOf(list[0], hi) > 0) ? list[0].name : null;
  const block = (arr, title, note) => !arr.length ? "" :
    '<h2 class="sec">' + title + '</h2><p class="secnote">' + note + "</p>"
    + '<div class="grid modes">' + arr.map((m, i) => modeCard(m, i, hi, m.name === bestName)).join("") + "</div>";
  document.getElementById("modesBody").innerHTML =
    block(normal, T.secNormal, T.normalNote(normal.length)) + block(endless, T.secEndless, T.endlessNote(endless.length))
    || '<p class="empty">' + T.nothing + "</p>";
}

function bindModes(){
  document.getElementById("curchips").addEventListener("click", e => {
    const b = e.target.closest(".chip");
    if(!b) return;
    if(b.id === "curonly"){
      mState.only = !mState.only;
      b.setAttribute("aria-pressed", String(mState.only));
    } else {
      mState.cur = b.dataset.c;
      document.querySelectorAll("#curchips .chip[data-c]").forEach(x =>
        x.setAttribute("aria-pressed", String(x.dataset.c === mState.cur)));
    }
    renderModes();
  });
}

/* ========== РОУТЕР ========== */
const app = document.getElementById("app");

function chrome(){
  document.documentElement.lang = LANG;
  document.title = T.docTitle;
  document.getElementById("brand").textContent = T.brand;
  document.getElementById("tagline").textContent = T.tagline;
  document.getElementById("intro").textContent = T.intro;
  document.getElementById("footnote").textContent = T.footnote;
  const labels = { units: T.tabUnits, crates: T.tabCrates, modes: T.tabModes };
  document.querySelectorAll("#tabs a").forEach(a => a.querySelector(".lbl").textContent = labels[a.dataset.v]);
  document.getElementById("n-units").textContent = U.length;
  document.getElementById("n-crates").textContent = BOXES.length;
  document.getElementById("n-modes").textContent = MODES.length;
  document.querySelectorAll("#langswitch button").forEach(b =>
    b.setAttribute("aria-pressed", String(b.dataset.lang === LANG)));

  const box = document.getElementById("updated");
  const d = new Date(BUILD_TS);
  if(isNaN(d)){ box.hidden = true; }
  else {
    const days = Math.floor((Date.now() - d.getTime()) / 86400000);
    const rel = days <= 0 ? T.today : (days === 1 ? T.yesterday : T.daysAgo(days));
    box.innerHTML = '<span class="dot"></span>' + T.updated + " <b>"
      + d.toLocaleDateString(T.locale, { day: "2-digit", month: "2-digit", year: "numeric" })
      + "</b> · " + rel;
    box.title = d.toLocaleString(T.locale);
  }
}

function route(keepScroll){
  const h = location.hash.replace(/^#\/?/, "") || "units";
  const parts = h.split("/").map(decodeURIComponent);
  let tab = "units";
  if(parts[0] === "unit"){ app.innerHTML = unitView(parts[1]); }
  else if(parts[0] === "box"){ app.innerHTML = boxView(parts[1]); tab = "crates"; }
  else if(parts[0] === "crates"){ app.innerHTML = cratesView(); renderCrates(); bindCrates(); tab = "crates"; }
  else if(parts[0] === "modes"){ app.innerHTML = modesView(); renderModes(); bindModes(); tab = "modes"; }
  else { app.innerHTML = unitsView(); renderUnits(); bindUnits(); }
  document.querySelectorAll("#tabs a").forEach(a => a.classList.toggle("on", a.dataset.v === tab));
  if(!keepScroll) window.scrollTo({ top: 0, behavior: "instant" });
}

function bindUnits(){
  document.getElementById("uq").addEventListener("input", e => { uState.q = e.target.value; renderUnits(); });
  document.getElementById("utype").addEventListener("change", e => { uState.type = e.target.value; renderUnits(); });
  const sortSel = document.getElementById("usort");
  sortSel.value = uState.sort;
  sortSel.addEventListener("change", e => { uState.sort = e.target.value; renderUnits(); });
  document.getElementById("utier").addEventListener("click", e => toggleChip(e, uState.tier, "t"));
  document.getElementById("urar").addEventListener("click", e => toggleChip(e, uState.rar, "r"));
}

function toggleChip(e, set, key){
  const b = e.target.closest(".chip");
  if(!b) return;
  const v = b.dataset[key];
  if(set.has(v)){ set.delete(v); b.setAttribute("aria-pressed", "false"); }
  else { set.add(v); b.setAttribute("aria-pressed", "true"); }
  renderUnits();
}

function bindCrates(){
  document.getElementById("cq").addEventListener("input", e => { cState.q = e.target.value; renderCrates(); });
  document.getElementById("coff").addEventListener("click", e => {
    cState.showOff = !cState.showOff;
    e.currentTarget.setAttribute("aria-pressed", String(cState.showOff));
    renderCrates();
  });
}

document.getElementById("langswitch").addEventListener("click", e => {
  const b = e.target.closest("button[data-lang]");
  if(!b || b.dataset.lang === LANG) return;
  LANG = b.dataset.lang;
  T = I18N[LANG];
  try { localStorage.setItem("slopcodex-lang", LANG); } catch(err){}
  chrome();
  route(true);
});

app.addEventListener("click", e => {
  const box = e.target.closest("[data-box]");
  if(box){ location.hash = "#/box/" + encodeURIComponent(box.dataset.box); return; }
  const unit = e.target.closest("[data-unit]");
  if(unit && byName[unit.dataset.unit]){ location.hash = "#/unit/" + encodeURIComponent(unit.dataset.unit); }
});

window.addEventListener("hashchange", () => route(false));
chrome();
route(false);
</script>
</body>
</html>
